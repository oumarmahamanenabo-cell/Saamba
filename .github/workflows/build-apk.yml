name: Build APK SAAMBA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Générer le dossier android (si absent)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.saamba --project-name saamba /tmp/scaffold
            cp -r /tmp/scaffold/android ./android
          fi

      - name: Adapter Android (permissions, nom, minSdk)
        run: python3 tools/patch_android.py .

      - name: Dépendances
        run: flutter pub get

      - name: Icône de l'application
        run: dart run flutter_launcher_icons

      - name: Compiler l'APK release
        run: flutter build apk --release

      - name: Renommer l'APK
        run: cp build/app/outputs/flutter-apk/app-release.apk SAAMBA.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SAAMBA-apk
          path: SAAMBA.apk
          if-no-files-found: error
